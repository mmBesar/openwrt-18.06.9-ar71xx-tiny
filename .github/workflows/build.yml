name: Build HW3 firmware (matches HW4 config)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download ImageBuilder
        run: |
          wget -q https://archive.openwrt.org/releases/18.06.9/targets/ar71xx/tiny/openwrt-imagebuilder-18.06.9-ar71xx-tiny.Linux-x86_64.tar.xz
          tar xJf openwrt-imagebuilder-18.06.9-ar71xx-tiny.Linux-x86_64.tar.xz
          mv openwrt-imagebuilder-18.06.9-ar71xx-tiny.Linux-x86_64 imagebuilder

      - name: Build image (matches HW4 package set)
        working-directory: imagebuilder
        run: |
          make FORCE=1 image PROFILE=tl-wa801nd-v3 \
            PACKAGES="-ip6tables -iw iw-full -kmod-ip6tables -kmod-nf-ipt6 -kmod-nf-reject6 \
              -kmod-ppp -kmod-pppoe -kmod-pppox -kmod-slhc -luci -luci-proto-ipv6 \
              -luci-proto-ppp -odhcp6c -odhcpd-ipv6only -ppp -ppp-mod-pppoe \
              -rpcd-mod-rrdns -wpad-mini wpad uhttpd-mod-ubus" \
            FILES=../files/

      - name: Show resulting image size
        run: ls -la imagebuilder/bin/ar71xx/*tl-wa801nd-v3*

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: hw3-firmware
          path: |
            imagebuilder/bin/ar71xx/openwrt-18.06.9-ar71xx-tiny-tl-wa801nd-v3-squashfs-sysupgrade.bin
            imagebuilder/bin/ar71xx/openwrt-18.06.9-ar71xx-tiny-tl-wa801nd-v3-squashfs-factory.bin
