name: Build firmware (TL-WA801ND v3)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build OpenWrt 18.06.9 image
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            debian:10 \
            bash -euxo pipefail -c '
              sed -i \
                -e "s|deb.debian.org/debian|archive.debian.org/debian|g" \
                -e "s|security.debian.org/debian-security|archive.debian.org/debian-security|g" \
                -e "/buster-updates/d" \
                /etc/apt/sources.list

              apt-get -o Acquire::Check-Valid-Until=false update

              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                build-essential \
                git \
                file \
                wget \
                tar \
                xz-utils \
                python \
                python2.7 \
                rsync \
                unzip \
                gawk \
                gettext \
                libncurses5-dev \
                zlib1g-dev \
                libssl-dev \
                xsltproc

              wget -q \
                https://archive.openwrt.org/releases/18.06.9/targets/ar71xx/tiny/openwrt-imagebuilder-18.06.9-ar71xx-tiny.Linux-x86_64.tar.xz

              tar xJf \
                openwrt-imagebuilder-18.06.9-ar71xx-tiny.Linux-x86_64.tar.xz

              mv \
                openwrt-imagebuilder-18.06.9-ar71xx-tiny.Linux-x86_64 \
                imagebuilder

              cd imagebuilder

              echo "=== Available TL-WA701/901 profiles ==="
              make info | grep -A10 -B3 -i "wa701\|wa901" || true

              echo "=== Building image ==="

              make image \
                PROFILE=tl-wa801nd-v3 \
                PACKAGES="\
                  -ip6tables \
                  -iw \
                  -kmod-ip6tables \
                  -kmod-nf-ipt6 \
                  -kmod-nf-reject6 \
                  -kmod-ppp \
                  -kmod-pppoe \
                  -kmod-pppox \
                  -kmod-slhc \
                  -luci \
                  -luci-proto-ipv6 \
                  -luci-proto-ppp \
                  -odhcp6c \
                  -odhcpd-ipv6only \
                  -ppp \
                  -ppp-mod-pppoe \
                  -rpcd-mod-rrdns \
                  -wpad-mini \
                  wpad-mesh-openssl \
                  uhttpd-mod-ubus \
                  libiwinfo \
                  libiwinfo-lua \
                  liblucihttp-lua \
                  luci-app-firewall \
                  luci-base \
                  luci-lib-ip \
                  luci-lib-jsonc \
                  luci-lib-nixio \
                  luci-mod-admin-full \
                  luci-theme-bootstrap" \
                FILES=../files/
            '

      - name: Show generated firmware
        run: |
          echo "=== ImageBuilder output ==="
          find imagebuilder/bin -type f -ls

          echo
          echo "=== Firmware images ==="
          find imagebuilder/bin \
            -type f \
            \( -name '*.bin' -o -name '*.trx' -o -name '*.img' \) \
            -print

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: hw4-tl-wa701nd-v1-firmware
          path: |
            imagebuilder/bin/**/*.bin
            imagebuilder/bin/**/*.trx
            imagebuilder/bin/**/*.img
          if-no-files-found: error
